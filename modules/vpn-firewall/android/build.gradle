plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.souljsx.spot.vpn'
version = '0.1.0'

// Stage 9: the WireGuard userspace tunnel library (Apache-2.0, Maven Central). The AAR
// bundles libwg-go/libwg/libwg-quick for arm64-v8a, armeabi-v7a, x86 and x86_64, so no NDK
// toolchain is required here. Its README requires core-library desugaring because it uses
// java.time/java.util.Optional style APIs on minSdk 24.
def wireGuardTunnelVersion = '1.0.20260102'

android {
  namespace "com.souljsx.spot.vpn"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
    coreLibraryDesugaringEnabled true
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation "com.wireguard.android:tunnel:${wireGuardTunnelVersion}"
  coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.3'
}
